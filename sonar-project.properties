# SonarQube Cloud configuration for Auren.
# The CI workflow intentionally uses npm install because the repository does not
# currently commit a package-lock.json. The workflow disables npm lifecycle scripts.
# Ignore only the lockfile-specific GitHub Actions rule for that intentional setup.
sonar.issue.ignore.multicriteria=ci_lock
sonar.issue.ignore.multicriteria.ci_lock.ruleKey=githubactions:S7694
sonar.issue.ignore.multicriteria.ci_lock.resourceKey=.github/workflows/ci.yml
